{% load static %}
<header>
    <div class="header_content">
        <!-- Le logo -->
        <div class="container-logo">
            <a href="{% url 'core:index' %}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-graduation-cap h-5 w-5" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"></path><path d="M22 10v6"></path><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path></svg>

                <span class="logo-text-container">
                    <strong class="logo-text">Find Your Trainer</strong>
                    <span class="logo-subtext">EDTECH MARKETPLACE</span>
                </span>
            </a>
        </div>
        
        <!-- Le menu de navigation -->
        <nav class="nav-menu">
            <ul class="nav-links">
                <li><a class="nav-items" href="{% url 'account:formateurs_list' %}">Formateurs</a></li>
                <li><a class="nav-items" href="{% url 'account:institutions_list' %}">Institutions</a></li>
            </ul>
        </nav>


        <!-- Les options de navigation -->
        <nav class="nav-options">
            <!-- Les boutons de thème -->
            <div>
                <button id="theme-toggle-moon" type="button" onclick="setSiteTheme('dark')" aria-label="Activer le thème sombre">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon h-4 w-4" aria-hidden="true"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
                </button>

                <button id="theme-toggle-sun" type="button" onclick="setSiteTheme('light')" style="display:none;" aria-label="Activer le thème clair">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun h-4 w-4" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                </button>
            </div>

            <!-- Les liens de connexion -->
            <div class="nav-auth-links">
                <a class="sign_in" href="{% url 'account:log_in' %}">Connexion</a>
                <a class="sign_up" href="{% url 'account:log_up' %}">Inscription</a>
            </div>
        </nav>        
    </div>
</header>
